<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>華語拼音排版範例（Tailwind CSS）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&family=Noto+Sans+TC:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="box-content mx-auto my-8 max-w-[42rem] space-y-8 bg-white px-4 font-sans">
  <h1 class="text-[2em] font-bold">華語拼音標音</h1>
  <section>
    <h2 class="mb-1 text-sm font-normal text-neutral-600">40px</h2>
    <div data-sample class="flex flex-wrap items-start gap-x-[6px] gap-y-[10px] font-['Noto_Sans_TC',sans-serif] text-[40px]"></div>
  </section>
  <section>
    <h2 class="mb-1 text-sm font-normal text-neutral-600">48px</h2>
    <div data-sample class="flex flex-wrap items-start gap-x-[6px] gap-y-[10px] font-['Noto_Sans_TC',sans-serif] text-[48px]"></div>
  </section>
  <section>
    <h2 class="mb-1 text-sm font-normal text-neutral-600">64px</h2>
    <div data-sample class="flex flex-wrap items-start gap-x-[6px] gap-y-[10px] font-['Noto_Sans_TC',sans-serif] text-[64px]"></div>
  </section>
  <section>
    <h2 class="mb-1 text-sm font-normal text-neutral-600">112px</h2>
    <div data-sample class="flex flex-wrap items-start gap-x-[6px] gap-y-[10px] font-['Noto_Sans_TC',sans-serif] text-[112px]"></div>
  </section>
  <section>
    <h2 class="mb-1 text-sm font-normal text-neutral-600">180px</h2>
    <div data-sample class="flex flex-wrap items-start gap-x-[6px] gap-y-[10px] font-['Noto_Sans_TC',sans-serif] text-[180px]"></div>
  </section>
  <template id="cards">
    <span class="inline-flex flex-col items-center text-black break-inside-avoid" role="img" aria-label="去，qù">
      <span class="font-['Noto_Sans',sans-serif] text-[.255em]/[1.2] whitespace-nowrap text-green-800" aria-hidden="true">qù</span>
      <span class="font-normal leading-[1.12]" aria-hidden="true">去</span>
    </span>
    <span class="inline-flex flex-col items-center text-black break-inside-avoid" role="img" aria-label="宣，xuān">
      <span class="font-['Noto_Sans',sans-serif] text-[.255em]/[1.2] whitespace-nowrap text-green-800" aria-hidden="true">xuān</span>
      <span class="font-normal leading-[1.12]" aria-hidden="true">宣</span>
    </span>
    <span class="inline-flex flex-col items-center text-black break-inside-avoid" role="img" aria-label="嗎，ma">
      <span class="font-['Noto_Sans',sans-serif] text-[.255em]/[1.2] whitespace-nowrap text-green-800" aria-hidden="true">ma</span>
      <span class="font-normal leading-[1.12]" aria-hidden="true">嗎</span>
    </span>
    <span class="inline-flex flex-col items-center text-black break-inside-avoid" role="img" aria-label="裝，zhuāng">
      <span class="font-['Noto_Sans',sans-serif] text-[.255em]/[1.2] whitespace-nowrap text-green-800" aria-hidden="true">zhuāng</span>
      <span class="font-normal leading-[1.12]" aria-hidden="true">裝</span>
    </span>
  </template>
  <script>
    const cards = document.getElementById('cards');
    for (const row of document.querySelectorAll('[data-sample]')) {
      row.append(cards.content.cloneNode(true));
    }
  </script>
</body>
</html>
